  <circle cx="320" cy="361" r="38" fill="url(#bg)"/>
  <circle cx="320" cy="361" r="16" fill="#fff" opacity=".9"/>
  <rect x="140" y="345" width="84" height="12" rx="6" fill="#7B4DFF" opacity=".55"/>
  <rect x="140" y="368" width="56" height="12" rx="6" fill="#7B4DFF" opacity=".35"/>
  <!-- the sparkle -->
  <path d="M206 168 C212 196 222 206 250 212 C222 218 212 228 206 256 C200 228 190 218 162 212 C190 206 200 196 206 168 Z" fill="#fff"/>
