# Builds FreeMyTV.apk and publishes it as a GitHub release when a version tag is pushed (git tag v1.2.0 && git push --tags).
# Installed copies update themselves from the latest release (Updates.java), so the APK must be signed with the same
# key as the first install: put that key in the FREEMYTV_KEYSTORE secret (base64 of freemytv.keystore). Without the
# secret a new key is made, which is fine for a first install but can't update an existing one.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build.sh numbers the version by the commits and names it by the latest tag

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;34.0.0 platforms;android-34"

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.FREEMYTV_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then echo "$KEYSTORE" | base64 -d > freemytv.keystore; fi

      - name: Build
        run: bash build.sh

      # The notes: the tag's message, or the commits since the previous tag ("feat:" → New, "fix:" → Fixes). The
      # projector shows them in its "What's New" sheet after updating itself.
      - name: Notes
        if: github.ref_type == 'tag'
        run: |
          # An annotated tag's message is the notes, written by hand (git tag -a v1.2.0 -F notes.md); without one,
          # they're made from the commits.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
            git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
            if [ -s notes.md ]; then cat notes.md; exit 0; fi
          fi
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range=${prev:+$prev..}$GITHUB_REF_NAME
          section() { lines=$(git log --no-merges --pretty='- %s' "$range" | grep -E "^- ($2)(\(|:)" | sed -E 's/^- [a-z]+(\([^)]*\))?: */- /'); [ -n "$lines" ] && printf '## %s\n%s\n\n' "$1" "$lines"; true; }
          { section "Novedades" "feat"; section "Mejoras" "style|perf"; section "Arreglos" "fix"; } > notes.md
          cat notes.md

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: FreeMyTV.apk
          body_path: notes.md

      - name: Artifact (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV
          path: FreeMyTV.apk
